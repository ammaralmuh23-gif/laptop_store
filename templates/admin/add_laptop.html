<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إضافة لابتوب</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login-box">
        <h2>إضافة لابتوب جديد</h2>
        <form method="POST" enctype="multipart/form-data">
            <label>اسم اللابتوب</label>
            <input type="text" name="name" required>
            
            <label>المواصفات</label>
            <textarea name="specs" required rows="3"></textarea>
            
            <label>السعر ($)</label>
            <input type="number" step="0.01" name="price" required>
            
            <label>صورة اللابتوب</label>
            <input type="file" name="image" accept="image/*" required>
            
            <button type="submit">إضافة اللابتوب</button>
        </form>
        <a href="{{ url_for('admin_dashboard') }}">العودة للوحة التحكم</a>
    </div>
</body>
</html>
