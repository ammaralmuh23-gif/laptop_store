<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل المنتج</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="logo">💻 لوحة تحكم المدير</div>
        <div>
            <a href="{{ url_for('admin_dashboard') }}" class="btn">العودة للمنتجات</a>
        </div>
    </header>

    <main class="container">
        <h1>تعديل المنتج: {{ laptop.name }}</h1>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        
        <form method="POST" enctype="multipart/form-data" class="login-box" style="width: 100%; max-width: 600px;">
            <label>اسم المنتج *</label>
            <input type="text" name="name" value="{{ laptop.name }}" required>
            
            <label>المواصفات *</label>
            <textarea name="specs" rows="3" required>{{ laptop.specs }}</textarea>
            
            <label>السعر ($) *</label>
            <input type="number" step="0.01" name="price" value="{{ laptop.price }}" required>
            
            <label>الصورة الحالية</label>
            <img src="{{ laptop.image_url }}" alt="{{ laptop.name }}" style="width: 100px; display: block; margin-bottom: 10px; border-radius: 5px;">
            
            <label>تغيير الصورة (اختياري)</label>
            <input type="file" name="image" accept="image/*">
            
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="btn-success" style="padding: 10px 20px; border: none; cursor: pointer;">حفظ التعديلات</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn" style="padding: 10px 20px; text-decoration: none; background: #95a5a6;">إلغاء</a>
            </div>
        </form>
    </main>
</body>
</html>
