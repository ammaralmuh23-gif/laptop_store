<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إعدادات المتجر</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header>
        <div class="logo">💻 متجر اللابتوبات</div>
        <div>
            <a href="{{ url_for('admin_dashboard') }}" class="btn">العودة للوحة التحكم</a>
            <a href="{{ url_for('logout') }}" class="btn btn-danger">خروج</a>
        </div>
    </header>

    <main class="container">
        <h1>إعدادات المتجر</h1>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <!-- نموذج واحد يجمع كل الإعدادات -->
        <form method="POST" class="login-box" style="margin-top: 20px; width: 100%; max-width: 600px;">
            
            <h3 style="margin-bottom: 15px; color: #1a252f;">إعدادات الواتساب</h3>
            <label for="whatsapp_number">رقم الواتساب (مع رمز الدولة بدون +)</label>
            <input type="text" id="whatsapp_number" name="whatsapp_number" value="{{ whatsapp_number }}" required style="margin-bottom: 20px;">

            <h3 style="margin-bottom: 15px; color: #1a252f;">البريد الإلكتروني لاستقبال الطلبات</h3>
            <label for="admin_email">البريد الإلكتروني</label>
            <input type="email" id="admin_email" name="admin_email" value="{{ admin_email }}" required style="margin-bottom: 20px;">

         <label for="new_password">كلمة المرور الجديدة (اتركها فارغة إذا لا تريد تغييرها)</label>
         <div class="password-container" style="position: relative; width: 100%; margin-bottom: 20px;">
          <input type="password" id="new_password" name="new_password" placeholder="********" style="width: 100%; padding: 10px; padding-left: 40px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
          <button type="button" class="toggle-password" onclick="togglePassword('new_password', this)" style="position: absolute; left: 10px; top: 40%; transform: translateY(-50%); background: transparent; border: none; cursor: pointer; color: #888; display: flex; align-items: center; padding: 0;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
           </svg>
         </button>
</div>

<script>
    function togglePassword(inputId, btn) {
        const input = document.getElementById(inputId);
        const eyeOpen = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" /></svg>`;
        const eyeClosed = `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" style="width: 20px; height: 20px;"><path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" /></svg>`;
        if (input.type === "password") {
            input.type = "text";
            btn.innerHTML = eyeClosed;
        } else {
            input.type = "password";
            btn.innerHTML = eyeOpen;
        }
    }
</script>
            <button type="submit" class="btn-success" style="width: 100%; padding: 12px; font-size: 16px;">حفظ جميع الإعدادات</button>
        </form>
    </main>
</body>
</html>
